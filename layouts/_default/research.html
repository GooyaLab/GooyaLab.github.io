{{ define "main" }}
<div class="wrap page">
  <h1 class="page-title">{{ .Title }}</h1>
  {{ with .Content }}<div class="prose intro">{{ . }}</div>{{ end }}
  <div class="research-list">
    {{ range $i, $r := site.Data.research }}
    <article class="research-item{{ if modBool $i 2 }}{{ else }} flip{{ end }}">
      <div class="r-img"><img src="{{ $r.image | relURL }}" alt="{{ $r.title }}"></div>
      <div class="r-text"><h2>{{ $r.title }}</h2><p>{{ $r.text | safeHTML }}</p></div>
    </article>
    {{ end }}
  </div>
</div>
{{ end }}
