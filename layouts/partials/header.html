<header class="header">
  <nav class="nav">
    <a class="logo" href="{{ "/" | relURL }}"><img src="{{ site.Params.logo | relURL }}" alt="{{ site.Title }} logo"></a>
    <input type="checkbox" id="nav-toggle" class="nav-toggle"><label for="nav-toggle" class="nav-burger" aria-label="Menu">&#9776;</label>
    <ul class="menu">
      {{ $current := . }}
      {{ range site.Menus.main }}
      {{ $active := or (and $current.IsHome (eq .URL "/")) (and (not $current.IsHome) (eq $current.RelPermalink (.URL | relURL))) }}
      <li><a href="{{ .URL | relURL }}"{{ if $active }} class="active"{{ end }}>{{ .Name }}</a></li>
      {{ end }}
    </ul>
  </nav>
</header>
